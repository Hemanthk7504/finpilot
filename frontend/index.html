<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinPilot MAX • AI-Powered Intelligent Personal Finance Advisor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      try {
        const storedTheme = localStorage.getItem("finpilot_theme") || "dark";
        if (storedTheme === "light") {
          document.documentElement.classList.add("light");
          document.documentElement.classList.remove("dark");
          document.querySelector('meta[name="color-scheme"]').content = "light";
        } else {
          document.documentElement.classList.add("dark");
          document.documentElement.classList.remove("light");
          document.querySelector('meta[name="color-scheme"]').content = "dark";
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#080C14] text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
